name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unzip and build
        run: |
          mkdir -p work
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z" -d work; done
          for z in $(find work -name '*.zip' | head -5); do unzip -q -o "$z" -d work; done
          DIR=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          cd "$DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" BenchSim-source.apk
          gh release create "apk-${{ github.run_number }}" BenchSim-source.apk \
            --title "BenchSim-source APK #${{ github.run_number }}" \
            --notes "Debug APK. Download BenchSim-source.apk and install."
